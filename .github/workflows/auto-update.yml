name: 브리핑 자동 업데이트

on:
  schedule:
    - cron: '30 22 * * *'
    - cron: '30 8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests beautifulsoup4 pytz lxml google-generativeai

      - name: 브리핑 업데이트 실행
        run: python update_briefing.py
        env:
          TZ: Asia/Seoul
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "auto: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 자동 업데이트"
          git push

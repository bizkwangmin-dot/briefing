<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="last-updated" content="2026-03-16T16:18:59+09:00">
  <title>세줄뉴스 — 오늘의 핵심을 3줄로</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ── 기본 변수 ── */
:root{
  --bg:#eceae3; --surface:#f7f5f0; --ink:#1c1c1e; --ink2:#4a4a4c; --ink3:#8a8a8e;
  --border:#dbd7ce; --tagbg:#e5e2da;
  --red:#7a1f1f; --navy:#1a3050; --gold:#7a5800; --green:#1a4a2e; --dark:#2a2a35;
  --accent:#2c4a6e; --warm:#b89650; --hh:56px;
  /* 간소화 모드 Charcoal+Zinc */
  --s-bg:#2e3b3e; --s-surface:#364446; --s-ink:#d8e4e2; --s-ink2:#b0c4c2;
  --s-ink3:#7a9896; --s-border:#4a5e60; --s-tagbg:#3a4e50; --s-accent:#8ec6c0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.65}
a{color:inherit;text-decoration:none}

/* ── 헤더 ── */
header{background:linear-gradient(135deg,#14243a 0%,#1a3050 60%,#1f3d66 100%);position:sticky;top:0;z-index:200;box-shadow:0 1px 8px rgba(0,0,0,.25)}
.hdr-row{display:flex;align-items:center;height:var(--hh);padding:0 20px;gap:16px}
.logo{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:900;color:#fff;letter-spacing:-.02em;white-space:nowrap}
.logo b{color:var(--warm)}
.hdr-meta{display:flex;flex-direction:column;gap:2px}
.hdr-date{font-size:13px;color:rgba(255,255,255,.75);font-weight:500;line-height:1.2}
.hdr-update{font-size:10px;color:rgba(255,255,255,.4);line-height:1.2}
.tabs{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.5);font-size:13px;font-weight:400;font-family:'Noto Sans KR',sans-serif;padding:0 14px;height:var(--hh);cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
.tab.on{color:#fff;border-bottom-color:var(--warm);font-weight:500}
.tab:hover:not(.on){color:rgba(255,255,255,.75)}
.btn-simple{margin-left:auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:12px;color:rgba(255,255,255,.6);font-size:11px;font-family:'Noto Sans KR',sans-serif;padding:5px 13px;cursor:pointer;transition:all .2s}
.btn-simple:hover{background:rgba(255,255,255,.15);color:#fff}

@media(max-width:699px){
  header{box-shadow:0 1px 6px rgba(0,0,0,.3)}
  .hdr-row{height:auto;flex-wrap:wrap;padding:10px 14px;gap:10px}
  .logo{font-size:16px}
  .hdr-meta{flex-direction:row;gap:6px;align-items:center}
  .hdr-date{font-size:12px}
  .hdr-update{font-size:9px}
  .tabs{width:100%;order:10;justify-content:flex-start;gap:0;margin-left:-4px}
  .tab{font-size:12px;padding:0 10px;height:36px}
  .btn-simple{font-size:10px;padding:4px 10px}
}

/* ── 레이아웃 ── */
main{max-width:1080px;margin:20px auto;padding:0 16px}
.sec{margin-bottom:28px}
.sec-title{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:700;color:var(--ink);margin-bottom:14px;border-bottom:2px solid var(--border);padding-bottom:6px}
.item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px;transition:box-shadow .2s,transform .1s}
.item:hover{box-shadow:0 2px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.item-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.item-num{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:var(--accent);flex-shrink:0}
.item-title{font-size:15px;font-weight:700;color:var(--ink);line-height:1.5;flex:1}
.item-title a{transition:color .15s}
.item-title a:hover{color:var(--accent)}
.item-summary{font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:8px;padding-left:26px}
.item-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink3);padding-left:26px;flex-wrap:wrap}
.item-source{font-weight:500;color:var(--ink2)}
.item-time{opacity:.7}
.item-tags{display:flex;gap:5px;flex-wrap:wrap}
.item-tag{background:var(--tagbg);border-radius:4px;padding:2px 7px;font-size:10px;color:var(--ink3)}

/* ── 간소화 모드 ── */
body.simple{background:var(--s-bg);color:var(--s-ink)}
body.simple .item{background:var(--s-surface);border-color:var(--s-border)}
body.simple .item:hover{box-shadow:0 2px 10px rgba(0,0,0,.3)}
body.simple .sec-title{color:var(--s-ink);border-bottom-color:var(--s-border)}
body.simple .item-title{color:var(--s-ink)}
body.simple .item-title a:hover{color:var(--s-accent)}
body.simple .item-num{color:var(--s-accent)}
body.simple .item-summary{color:var(--s-ink2)}
body.simple .item-meta{color:var(--s-ink3)}
body.simple .item-source{color:var(--s-ink2)}
body.simple .item-tag{background:var(--s-tagbg);color:var(--s-ink3)}

@media(max-width:699px){
  main{margin:16px auto;padding:0 12px}
  .sec{margin-bottom:24px}
  .sec-title{font-size:17px;margin-bottom:12px}
  .item{padding:12px 14px;margin-bottom:10px}
  .item-num{font-size:15px}
  .item-title{font-size:14px}
  .item-summary{font-size:12px;padding-left:24px}
  .item-meta{font-size:10px;padding-left:24px}
}
</style>
</head>
<body>

<header>
  <div class="hdr-row">
    <a href="/" class="logo">세줄<b>뉴스</b></a>
    <div class="hdr-meta">
      <div class="hdr-date">2025.1.11 (토)</div>
      <div class="hdr-update">기사 기준 오후 4:18</div>
    </div>
    <div class="tabs">
      <button class="tab on" data-sec="all">전체</button>
      <button class="tab" data-sec="경제 · 금융">경제·금융</button>
      <button class="tab" data-sec="기업 · 산업">기업·산업</button>
      <button class="tab" data-sec="정책 · 정치">정책·정치</button>
      <button class="tab" data-sec="국제">국제</button>
      <button class="tab" data-sec="사회 · 문화">사회·문화</button>
      <button class="tab" data-sec="칼럼 · 사설">칼럼·사설</button>
    </div>
    <button class="btn-simple" onclick="toggleSimple()">간소화</button>
  </div>
</header>

<main id="main">
  <div class="sec" data-sec="경제 · 금융">
    <h2 class="sec-title">경제 · 금융</h2>
    <div class="item">
      <div class="item-head">
        <div class="item-num">1</div>
        <div class="item-title"><a href="#" target="_blank">샘플 기사 제목입니다</a></div>
      </div>
      <div class="item-summary">이것은 샘플 요약 내용입니다. 실제 업데이트 시 AI가 생성한 3줄 요약이 표시됩니다.</div>
      <div class="item-meta">
        <span class="item-source">조선일보</span>
        <span class="item-time">3시간 전</span>
        <div class="item-tags">
          <span class="item-tag">금융</span>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
// ── 탭 전환 ──
const tabs = document.querySelectorAll('.tab');
const secs = document.querySelectorAll('.sec');
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    const target = tab.dataset.sec;
    tabs.forEach(t => t.classList.remove('on'));
    tab.classList.add('on');
    if (target === 'all') {
      secs.forEach(s => s.style.display = 'block');
    } else {
      secs.forEach(s => {
        s.style.display = s.dataset.sec === target ? 'block' : 'none';
      });
    }
  });
});

// ── 간소화 모드 ──
function toggleSimple() {
  document.body.classList.toggle('simple');
  localStorage.setItem('simpleMode', document.body.classList.contains('simple'));
}
if (localStorage.getItem('simpleMode') === 'true') {
  document.body.classList.add('simple');
}
</script>

</body>
</html>
